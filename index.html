<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jacobs Burger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black:        #080808;
  --surface:      #0E0D0A;
  --card:         #181510;
  --card-hover:   #1F1C13;
  --gold:         #C8972A;
  --gold-light:   #E8B84B;
  --gold-dim:     rgba(200,151,42,0.14);
  --cream:        #F2E8D0;
  --cream-dim:    rgba(242,232,208,0.55);
  --cream-mute:   rgba(242,232,208,0.30);
  --border:       rgba(200,151,42,0.16);
  --border-mid:   rgba(200,151,42,0.28);
  --border-strong:rgba(200,151,42,0.45);
  --red:          #B83232;
  --green-bg:     rgba(28,80,40,0.35);
  --green-border: rgba(80,180,100,0.22);
  --green-text:   #72c472;
}

html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--black);
  color: var(--cream);
}

/* ─── LAYOUT ─── */
.app { display: flex; height: 100vh; }

/* ─── SIDEBAR ─── */
.sidebar {
  width: 296px;
  min-width: 296px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: relative;
}
.sidebar::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent 0%, var(--gold) 50%, transparent 100%);
  z-index: 1;
}

/* iPad */
@media (max-width: 900px) {
  .sidebar { width: 220px; min-width: 220px; }
  .logo-name { font-size: 24px; }
  .bgrid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
}

/* LOGO */
.logo {
  padding: 26px 22px 20px;
  border-bottom: 1px solid var(--border);
}
.logo-eyebrow {
  font-size: 9px;
  letter-spacing: .24em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 7px;
}
.logo-name {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--cream);
  line-height: 1.1;
  letter-spacing: -.01em;
}
.logo-name span { color: var(--gold-light); font-style: italic; }
.logo-tagline {
  font-size: 10.5px;
  color: var(--cream-mute);
  margin-top: 6px;
  letter-spacing: .04em;
}
.logo-veg {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 13px;
  background: var(--green-bg);
  border: 1px solid var(--green-border);
  color: var(--green-text);
  font-size: 9.5px;
  letter-spacing: .07em;
  padding: 4px 11px;
  border-radius: 20px;
  text-transform: uppercase;
}

/* NAV */
.nav { padding: 14px 0; flex: 1; }
.nav-label {
  font-size: 9px;
  letter-spacing: .2em;
  color: var(--cream-mute);
  text-transform: uppercase;
  padding: 10px 22px 5px;
}
.nav-btn {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 11px 22px;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  color: var(--cream-dim);
  background: none;
  border: none;
  cursor: pointer;
  text-align: left;
  transition: background .15s, color .15s;
  position: relative;
}
.nav-btn:hover { background: var(--gold-dim); color: var(--cream); }
.nav-btn.active { background: var(--gold-dim); color: var(--gold-light); font-weight: 500; }
.nav-btn.active::before {
  content: '';
  position: absolute;
  left: 0; top: 22%; bottom: 22%;
  width: 2px;
  background: var(--gold);
  border-radius: 2px;
}
.nav-icon { font-size: 17px; width: 22px; text-align: center; }
.nav-badge {
  margin-left: auto;
  background: var(--red);
  color: #fff;
  font-size: 10px;
  min-width: 18px; height: 18px;
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 5px;
  font-weight: 600;
}

/* CART */
.cart-panel {
  border-top: 1px solid var(--border);
  padding: 16px 18px 18px;
  background: var(--card);
}
.cart-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 11px;
}
.cart-head-label {
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 500;
}
.cart-pill {
  background: var(--gold);
  color: var(--black);
  font-size: 10px;
  font-weight: 700;
  width: 22px; height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.name-row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  margin-bottom: 11px;
  transition: border-color .2s;
}
.name-row:focus-within { border-color: var(--border-mid); }
.name-row input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  color: var(--cream);
}
.name-row input::placeholder { color: var(--cream-mute); }

.cart-list { max-height: 158px; overflow-y: auto; margin-bottom: 11px; }
.cart-list::-webkit-scrollbar { width: 3px; }
.cart-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.cart-row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 0;
  border-bottom: 1px solid rgba(200,151,42,0.08);
}
.cart-row:last-child { border-bottom: none; }
.c-name { flex: 1; font-size: 11.5px; color: var(--cream-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-qty  { font-size: 11px; color: var(--cream-mute); min-width: 22px; text-align: center; }
.c-price { font-size: 12px; font-family: 'Playfair Display', serif; color: var(--gold-light); min-width: 48px; text-align: right; }
.c-del { background: none; border: none; color: var(--cream-mute); cursor: pointer; font-size: 15px; padding: 1px 3px; transition: color .12s; }
.c-del:hover { color: var(--red); }
.cart-empty { text-align: center; padding: 14px; color: var(--cream-mute); font-size: 12px; }

.cart-total-bar {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-top: 9px;
  margin-bottom: 11px;
  border-top: 1px solid var(--border);
}
.total-label { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--cream-mute); }
.total-price { font-family: 'Playfair Display', serif; font-size: 23px; color: var(--gold-light); }

.btn-order {
  width: 100%;
  background: linear-gradient(135deg, #B8841E 0%, #E8B84B 50%, #B8841E 100%);
  background-size: 200% 100%;
  color: #0A0800;
  border: none;
  border-radius: 9px;
  padding: 12px;
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .1em;
  cursor: pointer;
  text-transform: uppercase;
  transition: background-position .4s, opacity .2s;
}
.btn-order:hover { background-position: 100% 0; }
.btn-order:disabled { opacity: 0.28; cursor: not-allowed; }

/* ─── MAIN ─── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.topbar {
  padding: 20px 30px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: baseline;
  gap: 14px;
}
.topbar-title {
  font-family: 'Playfair Display', serif;
  font-size: 23px;
  font-weight: 600;
}
.topbar-sub { font-size: 12px; color: var(--cream-mute); }

.content { flex: 1; overflow-y: auto; padding: 26px 30px 30px; }
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.eyebrow {
  font-size: 9.5px;
  letter-spacing: .22em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.eyebrow::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ─── BURGER GRID ─── */
.bgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(222px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}

.bcard {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 15px;
  overflow: hidden;
  position: relative;
  transition: transform .22s cubic-bezier(.22,1,.36,1), border-color .2s, box-shadow .2s;
}
.bcard:hover {
  transform: translateY(-4px);
  border-color: var(--border-mid);
  box-shadow: 0 16px 48px rgba(0,0,0,0.55), 0 0 0 1px rgba(200,151,42,0.1);
}
.bcard.hl { border-color: rgba(200,151,42,0.42); }
.bcard.hl .bcard-highlight-ribbon {
  position: absolute;
  top: 14px; left: 14px; z-index: 3;
  background: var(--gold);
  color: #0A0800;
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 20px;
}
.veggie-pin {
  position: absolute;
  top: 14px; right: 14px; z-index: 3;
  background: rgba(22,66,34,0.88);
  border: 1px solid rgba(80,200,100,0.28);
  color: var(--green-text);
  font-size: 8.5px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 4px 9px;
  border-radius: 20px;
}

.bimg {
  width: 100%;
  height: 182px;
  overflow: hidden;
  position: relative;
  background: #1A1710;
}
.bimg img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .45s cubic-bezier(.22,1,.36,1);
}
.bcard:hover .bimg img { transform: scale(1.07); }
.bimg-fade {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, var(--card) 0%, rgba(0,0,0,0) 52%);
}

.bbody { padding: 13px 15px 15px; }
.bname {
  font-family: 'Playfair Display', serif;
  font-size: 15.5px;
  font-weight: 600;
  color: var(--cream);
  line-height: 1.25;
  margin-bottom: 5px;
}
.bdesc {
  font-size: 11px;
  color: var(--cream-mute);
  line-height: 1.62;
  margin-bottom: 13px;
  min-height: 36px;
}
.bfooter {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.bprice-wrap {}
.bprice-label { font-size: 8.5px; letter-spacing: .1em; color: var(--cream-mute); margin-bottom: 1px; text-transform: uppercase; }
.bprice { font-family: 'Playfair Display', serif; font-size: 23px; color: var(--gold-light); line-height: 1; }

.btn-add {
  width: 38px; height: 38px;
  background: var(--gold-dim);
  border: 1px solid var(--border-mid);
  border-radius: 10px;
  color: var(--gold-light);
  font-size: 22px;
  font-weight: 300;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .18s, transform .14s;
  flex-shrink: 0;
}
.btn-add:hover { background: rgba(200,151,42,0.28); transform: scale(1.1); }
.btn-add.ok { background: rgba(28,100,48,0.45); border-color: rgba(80,200,100,0.35); color: var(--green-text); }

/* ─── EXTRAS ─── */
.egrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 9px;
  margin-bottom: 26px;
}
.ecard {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 11px;
  transition: border-color .18s, background .18s;
}
.ecard:hover { border-color: var(--border-mid); background: var(--card-hover); }
.eemoji { font-size: 23px; flex-shrink: 0; }
.einfo { flex: 1; min-width: 0; }
.ename { font-size: 12.5px; font-weight: 500; color: var(--cream); }
.eprice { font-size: 11px; color: var(--gold); font-family: 'Playfair Display', serif; margin-top: 1px; }

.btn-add-s {
  width: 28px; height: 28px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--cream-dim);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color .15s, color .15s;
  flex-shrink: 0;
}
.btn-add-s:hover { border-color: var(--gold); color: var(--gold-light); }
.btn-add-s.ok { border-color: rgba(80,200,100,0.35); color: var(--green-text); }

/* ─── BESTELLUNGEN ─── */
.olist { display: flex; flex-direction: column; gap: 13px; }
.ocard {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 17px 20px;
  transition: border-color .18s;
}
.ocard:hover { border-color: var(--border-mid); }
.oheader { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 11px; gap: 10px; }
.oname { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 600; }
.otime { font-size: 10.5px; color: var(--cream-mute); margin-top: 2px; }
.oright { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.opill { font-size: 10.5px; font-weight: 500; letter-spacing: .05em; padding: 4px 12px; border-radius: 20px; }
.op-pending { background: rgba(200,151,42,0.14); color: var(--gold-light); border: 1px solid rgba(200,151,42,0.28); }
.op-done    { background: var(--green-bg);           color: var(--green-text);   border: 1px solid var(--green-border); }
.otoggle {
  background: none;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 4px 11px;
  font-size: 11.5px;
  color: var(--cream-dim);
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: all .14s;
}
.otoggle:hover { border-color: var(--border-mid); color: var(--cream); }
.oitems {
  font-size: 12.5px;
  color: var(--cream-mute);
  line-height: 1.75;
  border-top: 1px solid var(--border);
  padding-top: 10px;
  margin-bottom: 8px;
}
.ototal { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--gold-light); }

/* ─── EMPTY ─── */
.empty { text-align: center; padding: 80px 20px; }
.empty-ico { font-size: 52px; opacity: .35; margin-bottom: 16px; }
.empty-t { font-family: 'Playfair Display', serif; font-size: 19px; color: var(--cream); margin-bottom: 6px; }
.empty-s { font-size: 12.5px; color: var(--cream-mute); }

/* ─── MODAL ─── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.78);
  display: flex; align-items: center; justify-content: center;
  z-index: 300;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.modal {
  background: var(--card);
  border: 1px solid var(--border-strong);
  border-radius: 18px;
  padding: 28px;
  width: 390px;
  position: relative;
  overflow: hidden;
}
.modal::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.modal-t {
  font-family: 'Playfair Display', serif;
  font-size: 21px; font-weight: 600;
  color: var(--cream);
  margin-bottom: 4px;
}
.modal-for { font-size: 12.5px; color: var(--cream-mute); margin-bottom: 18px; }
.modal-for strong { color: var(--gold-light); font-weight: 500; }
.mitem {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  padding: 5.5px 0;
  color: var(--cream-dim);
  border-bottom: 1px solid rgba(200,151,42,0.07);
}
.mitem:last-of-type { border-bottom: none; }
.mitem-p { font-family: 'Playfair Display', serif; color: var(--gold-light); }
.mdiv { border: none; border-top: 1px solid var(--border); margin: 13px 0; }
.mtotal { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
.mtotal-l { font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: var(--cream-mute); }
.mtotal-p { font-family: 'Playfair Display', serif; font-size: 27px; color: var(--gold-light); }
.mactions { display: flex; gap: 9px; }
.btn-cancel {
  flex: 1;
  background: none;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 11px;
  font-size: 13px;
  color: var(--cream-dim);
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: all .14s;
}
.btn-cancel:hover { border-color: var(--border-mid); color: var(--cream); }
.btn-confirm {
  flex: 2;
  background: linear-gradient(135deg, #C8972A, #E8B84B);
  color: #080600;
  border: none;
  border-radius: 9px;
  padding: 11px;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: .07em;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  text-transform: uppercase;
  transition: opacity .14s;
}
.btn-confirm:hover { opacity: .85; }
.success-big { font-size: 54px; display: block; text-align: center; margin-bottom: 13px; }

/* ═══════════════════════════════════════════
   MOBILE (≤ 600px)
   Sidebar → weg, Bottom-Nav + Cart-Drawer
═══════════════════════════════════════════ */
@media (max-width: 600px) {

  /* Sidebar weg */
  .sidebar { display: none; }

  /* App einspaltig */
  .app { flex-direction: column; }

  /* Main-Bereich unter Topbar, über Bottom-Nav */
  .main { height: calc(100vh - 60px); }

  /* Topbar */
  .topbar { padding: 12px 16px 10px; gap: 8px; }
  .topbar-title { font-size: 18px; }
  .topbar-sub   { font-size: 10px; }

  /* Content */
  .content { padding: 14px 10px 16px; }

  /* Burger-Grid: 2 Spalten */
  .bgrid { grid-template-columns: repeat(2, 1fr); gap: 9px; }

  /* Burger-Karten kompakter */
  .bimg { height: 120px; }
  .bbody { padding: 8px 9px 10px; }
  .bname { font-size: 12.5px; }
  .bdesc { font-size: 9.5px; min-height: 0; margin-bottom: 8px; line-height: 1.5; }
  .bprice { font-size: 18px; }
  .bprice-label { font-size: 7.5px; }
  .btn-add { width: 32px; height: 32px; font-size: 19px; border-radius: 8px; }

  /* Extras: 1 Spalte */
  .egrid { grid-template-columns: 1fr; }

  /* Bestellkarten */
  .oheader { flex-direction: column; gap: 8px; }
  .oright   { flex-wrap: wrap; }
  .otoggle  { font-size: 11px; padding: 4px 8px; }

  /* Modal */
  .modal { width: calc(100vw - 24px); padding: 20px 16px; border-radius: 16px; }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    display: flex;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    z-index: 100;
  }
  .bn-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: none;
    border: none;
    color: var(--cream-mute);
    font-family: 'Inter', sans-serif;
    font-size: 9.5px;
    cursor: pointer;
    position: relative;
    transition: color .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .bn-btn.active { color: var(--gold-light); }
  .bn-icon { font-size: 21px; }
  .bn-badge {
    position: absolute;
    top: 7px; right: calc(50% - 20px);
    background: var(--red);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    min-width: 15px; height: 15px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 3px;
  }
  .bn-cart-pill {
    position: absolute;
    top: 7px; right: calc(50% - 20px);
    background: var(--gold);
    color: var(--black);
    font-size: 9px;
    font-weight: 700;
    min-width: 15px; height: 15px;
    border-radius: 8px;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0 3px;
  }

  /* ── CART DRAWER ── */
  .cart-drawer-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 200;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .cart-drawer-overlay.open { display: block; }

  .cart-drawer {
    position: fixed;
    bottom: 60px; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border-strong);
    border-radius: 20px 20px 0 0;
    padding: 8px 18px 24px;
    z-index: 201;
    transform: translateY(105%);
    transition: transform .32s cubic-bezier(.22,1,.36,1);
    max-height: 82vh;
    overflow-y: auto;
  }
  .cart-drawer.open { transform: translateY(0); }

  .drawer-handle {
    width: 36px; height: 4px;
    background: var(--border-mid);
    border-radius: 2px;
    margin: 10px auto 14px;
  }
}

/* Desktop: mobile-only Elemente nie zeigen */
@media (min-width: 601px) {
  .bottom-nav,
  .cart-drawer,
  .cart-drawer-overlay { display: none !important; }
}
</style>
</head>
<body>
<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="logo">
    <div class="logo-eyebrow">— Hausgemachte Burger</div>
    <div class="logo-name">Jacobs<br><span>Burger</span></div>
    <div class="logo-tagline">Frisch · Hausgemacht · Mit Liebe</div>
    <span class="logo-veg">🌿 Alle auch vegetarisch</span>
  </div>

  <nav class="nav">
    <div class="nav-label">Menü</div>
    <button class="nav-btn active" onclick="gotoPage('burger')" id="nav-burger">
      <span class="nav-icon">🍔</span> Burger
    </button>
    <button class="nav-btn" onclick="gotoPage('extras')" id="nav-extras">
      <span class="nav-icon">✨</span> Extras &amp; Beilagen
    </button>
    <button class="nav-btn" onclick="gotoPage('orders')" id="nav-orders">
      <span class="nav-icon">📋</span> Bestellungen
      <span class="nav-badge" id="obadge" style="display:none">0</span>
    </button>
  </nav>

  <div class="cart-panel">
    <div class="cart-head">
      <span class="cart-head-label">Warenkorb</span>
      <span class="cart-pill" id="cpill">0</span>
    </div>
    <div class="name-row">
      <span style="font-size:14px;color:var(--cream-mute)">👤</span>
      <input id="uname" type="text" placeholder="Dein Name..." maxlength="26">
    </div>
    <div class="cart-list" id="clist"><div class="cart-empty">Noch nichts ausgewählt</div></div>
    <div class="cart-total-bar">
      <span class="total-label">Gesamt</span>
      <span class="total-price" id="ctotal">0,00 €</span>
    </div>
    <button class="btn-order" id="borderbtn" onclick="openModal()" disabled>Jetzt bestellen</button>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="topbar">
    <span class="topbar-title" id="ptitle">Burger</span>
    <span class="topbar-sub" id="psub">Wähle deinen Lieblingsburger</span>
  </div>
  <div class="content" id="pcontent"></div>
</main>

</div><!-- /.app -->

<!-- MOBILE: BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="bn-btn active" id="bn-burger" onclick="gotoPage('burger')">
    <span class="bn-icon">🍔</span>
    Burger
  </button>
  <button class="bn-btn" id="bn-extras" onclick="gotoPage('extras')">
    <span class="bn-icon">✨</span>
    Extras
  </button>
  <button class="bn-btn" id="bn-orders" onclick="gotoPage('orders')">
    <span class="bn-icon">📋</span>
    Bestellt
    <span class="bn-badge" id="bn-obadge" style="display:none">0</span>
  </button>
  <button class="bn-btn" id="bn-cart" onclick="toggleDrawer()">
    <span class="bn-icon">🛒</span>
    Warenkorb
    <span class="bn-cart-pill" id="bn-cpill">0</span>
  </button>
</nav>

<!-- MOBILE: CART DRAWER -->
<div class="cart-drawer-overlay" id="drawer-overlay" onclick="toggleDrawer()"></div>
<div class="cart-drawer" id="cart-drawer">
  <div class="drawer-handle"></div>
  <div class="cart-head">
    <span class="cart-head-label">Warenkorb</span>
    <span class="cart-pill" id="cpill-d">0</span>
  </div>
  <div class="name-row" style="margin-top:10px">
    <span style="font-size:14px;color:var(--cream-mute)">👤</span>
    <input id="uname-d" type="text" placeholder="Dein Name..." maxlength="26">
  </div>
  <div class="cart-list" id="clist-d"><div class="cart-empty">Noch nichts ausgewählt</div></div>
  <div class="cart-total-bar">
    <span class="total-label">Gesamt</span>
    <span class="total-price" id="ctotal-d">0,00 €</span>
  </div>
  <button class="btn-order" id="borderbtn-d" onclick="openModalMobile()" disabled>Jetzt bestellen</button>
</div>

<script>
/* ── DATA ── */
const IMGS = {
  cheeseburger: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=640&q=85',
  originals:    'https://images.unsplash.com/photo-1550547660-d9450f859349?w=640&q=85',
  smokingbbq:   'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQFo8C36l81anNoH28Ae_s94DZw4vDXO4t_rPA-1rvXFFhkaHWBnRCkj0uA&s=10',
  doublecheese: 'https://pommesfreunde.de/wp-content/uploads/2024/02/Smash-Double-Cheese-Burger.webp',
  chili:        'https://livingbbq.de/wp-content/uploads/2022/06/Chili-Cheese-Burger-1-von-1.jpg',
  mushroom:     'https://images.unsplash.com/photo-1549611016-3a70d82b5040?w=640&q=85',
  bbqchicken:   'https://images.unsplash.com/photo-1606755962773-d324e0a13086?w=640&q=85',
  veggie:       'https://images.unsplash.com/photo-1520072959219-c595dc870360?w=640&q=85',
};

const BURGER = [
  { id:'cheeseburger', name:'Cheeseburger',            price:5.90, desc:'Saftiger Beef-Patty mit geschmolzenem Cheddar und unserer hausgemachten Haus-Sauce – der perfekte Klassiker.' },
  { id:'originals',    name:'Jacobs Originals Burger', price:7.40, desc:'Unser Hausklassiker mit allem: knackiger Salat, frische Tomate, Gurke, Zwiebeln, geschmolzener Käse und unsere Haus-Sauce.', highlight:true },
  { id:'smokingbbq',   name:'Smoking BBQ Bacon Burger', price:6.90, desc:'Cheeseburger mit knusprig gebratenem Bacon und rauchiger BBQ-Sauce – intensiv, würzig, unwiderstehlich.' },
  { id:'doublecheese', name:'Double Cheese Burger',    price:7.40, desc:'Zwei saftige Beef-Patties, doppelt Käse – doppelt lecker. Für alle, die es richtig meinen.' },
  { id:'chili',        name:'Chili Cheese Burger',     price:6.40, desc:'Geschmolzener Käse, feurige Jalapeños, rote Zwiebeln, hausgemachte Chili-Sauce und knackiger Salat.' },
  { id:'mushroom',     name:'Mushroom Burger',         price:6.90, desc:'Saftig gebratene Champignons, zerlaufener Käse, hausgemachte Pilz-Soße und frischer Salat.' },
  { id:'bbqchicken',   name:'BBQ Chicken Burger',      price:6.90, desc:'Knuspriges Hähnchen-Filet, rauchige BBQ-Sauce, knackiger Salat, frische Tomate und Zwiebeln.' },
  { id:'veggie',       name:'Veggie Deluxe Burger',    price:6.90, desc:'Herzhafter Veggie-Patty, Käse, frischer Salat, Tomate, Gurke, Zwiebeln und hausgemachte Sauce – vollmundig vegetarisch.', veggie:true },
];

const EXTRAS = [
  { id:'ei',     name:'Ei',               emoji:'🥚', price:0.50 },
  { id:'bacon',  name:'Bacon',            emoji:'🥓', price:0.50 },
  { id:'jalap',  name:'Jalapeños',        emoji:'🌶️', price:0.50 },
  { id:'kase',   name:'Extra Käse',       emoji:'🧀', price:0.50 },
  { id:'roestz', name:'Röstzwiebeln',     emoji:'🧅', price:0.50 },
  { id:'sauce',  name:'Haus-Sauce',       emoji:'🫙', price:0.50 },
  { id:'patty',  name:'Extra Patty',      emoji:'🍔', price:2.00 },
];

const BEILAGEN = [
  { id:'sweetpommes', name:'Süßkartoffelpommes', emoji:'🍠', price:2.90 },
  { id:'salat',       name:'Salat',              emoji:'🥗', price:2.90 },
  { id:'mayo',        name:'Mayo',               emoji:'🫙', price:0.50 },
  { id:'ketchup',     name:'Ketchup',            emoji:'🍅', price:0.50 },
];

/* ── STATE ── */
let cart   = [];
let orders = [];

/* ── UTILS ── */
const fmt = p => p.toFixed(2).replace('.', ',') + '\u00a0€';
const isMobile = () => window.innerWidth <= 600;

function addItem(id, name, price, btn) {
  const ex = cart.find(c => c.id === id);
  ex ? ex.qty++ : cart.push({ id, name, price, qty: 1 });
  renderCart();
  if (btn) {
    const orig = btn.textContent;
    btn.textContent = '✓';
    btn.classList.add('ok');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('ok'); }, 750);
  }
}

function removeItem(id) {
  const i = cart.findIndex(c => c.id === id);
  if (i < 0) return;
  cart[i].qty > 1 ? cart[i].qty-- : cart.splice(i, 1);
  renderCart();
}

function renderCart() {
  const total = cart.reduce((s, c) => s + c.price * c.qty, 0);
  const count = cart.reduce((s, c) => s + c.qty, 0);

  /* Desktop */
  document.getElementById('ctotal').textContent = fmt(total);
  document.getElementById('cpill').textContent  = count;
  document.getElementById('borderbtn').disabled = !cart.length;
  const el = document.getElementById('clist');
  el.innerHTML = !cart.length
    ? '<div class="cart-empty">Noch nichts ausgewählt</div>'
    : cart.map(c => `
        <div class="cart-row">
          <span class="c-name">${c.name}</span>
          <span class="c-qty">×${c.qty}</span>
          <span class="c-price">${fmt(c.price * c.qty)}</span>
          <button class="c-del" onclick="removeItem('${c.id}')">−</button>
        </div>`).join('');

  /* Mobile Drawer */
  document.getElementById('ctotal-d').textContent = fmt(total);
  document.getElementById('cpill-d').textContent  = count;
  document.getElementById('borderbtn-d').disabled = !cart.length;
  const eld = document.getElementById('clist-d');
  eld.innerHTML = !cart.length
    ? '<div class="cart-empty">Noch nichts ausgewählt</div>'
    : cart.map(c => `
        <div class="cart-row">
          <span class="c-name">${c.name}</span>
          <span class="c-qty">×${c.qty}</span>
          <span class="c-price">${fmt(c.price * c.qty)}</span>
          <button class="c-del" onclick="removeItem('${c.id}')">−</button>
        </div>`).join('');

  /* Bottom-Nav Warenkorb-Pill */
  const pill = document.getElementById('bn-cpill');
  if (pill) {
    pill.textContent = count;
    pill.style.display = count > 0 ? 'inline-flex' : 'none';
  }
}

/* ── MOBILE DRAWER ── */
function toggleDrawer() {
  const drawer  = document.getElementById('cart-drawer');
  const overlay = document.getElementById('drawer-overlay');
  const open    = drawer.classList.toggle('open');
  overlay.classList.toggle('open', open);
}

/* ── PAGES ── */
function gotoPage(page) {
  /* Desktop Nav */
  ['burger','extras','orders'].forEach(p =>
    document.getElementById('nav-' + p).classList.toggle('active', p === page));

  /* Mobile Bottom-Nav */
  ['burger','extras','orders'].forEach(p => {
    const b = document.getElementById('bn-' + p);
    if (b) b.classList.toggle('active', p === page);
  });

  const title = { burger:'Burger', extras:'Extras & Beilagen', orders:'Bestellungen' };
  const sub   = { burger:'Wähle deinen Lieblingsburger', extras:'Mach deinen Burger noch besser', orders:'Alle Bestellungen der Familie' };
  document.getElementById('ptitle').textContent = title[page];
  document.getElementById('psub').textContent   = sub[page];

  if (page === 'burger')  renderBurger();
  if (page === 'extras')  renderExtras();
  if (page === 'orders')  renderOrders();
}

function renderBurger() {
  document.getElementById('pcontent').innerHTML = `
    <div class="eyebrow">Unsere Burger</div>
    <div class="bgrid">
      ${BURGER.map(b => `
        <div class="bcard ${b.highlight ? 'hl' : ''}">
          ${b.highlight ? '<div class="bcard-highlight-ribbon">⭐ Highlight</div>' : ''}
          ${b.veggie    ? '<div class="veggie-pin">🌿 Veggie</div>' : ''}
          <div class="bimg">
            <img src="${IMGS[b.id]}" alt="${b.name}" loading="lazy">
            <div class="bimg-fade"></div>
          </div>
          <div class="bbody">
            <div class="bname">${b.name}</div>
            <div class="bdesc">${b.desc}</div>
            <div class="bfooter">
              <div class="bprice-wrap">
                <div class="bprice-label">Preis</div>
                <div class="bprice">${fmt(b.price)}</div>
              </div>
              <button class="btn-add" id="ba-${b.id}"
                onclick="addItem('${b.id}','${b.name.replace(/'/g,"\\'")}',${b.price},this)">+</button>
            </div>
          </div>
        </div>`).join('')}
    </div>`;
}

function renderExtras() {
  document.getElementById('pcontent').innerHTML = `
    <div class="eyebrow">Extras</div>
    <div class="egrid">
      ${EXTRAS.map(e => `
        <div class="ecard">
          <span class="eemoji">${e.emoji}</span>
          <div class="einfo">
            <div class="ename">${e.name}</div>
            <div class="eprice">+${fmt(e.price)}</div>
          </div>
          <button class="btn-add-s" id="ba-${e.id}"
            onclick="addItem('${e.id}','${e.name}',${e.price},this)">+</button>
        </div>`).join('')}
    </div>
    <div class="eyebrow" style="margin-top:4px">Beilagen</div>
    <div class="egrid">
      ${BEILAGEN.map(b => `
        <div class="ecard">
          <span class="eemoji">${b.emoji}</span>
          <div class="einfo">
            <div class="ename">${b.name}</div>
            <div class="eprice">${fmt(b.price)}</div>
          </div>
          <button class="btn-add-s" id="ba-${b.id}"
            onclick="addItem('${b.id}','${b.name}',${b.price},this)">+</button>
        </div>`).join('')}
    </div>`;
}

function renderOrders() {
  const el = document.getElementById('pcontent');
  updateBadge();
  if (!orders.length) {
    el.innerHTML = `<div class="empty">
      <div class="empty-ico">📋</div>
      <div class="empty-t">Noch keine Bestellungen</div>
      <div class="empty-s">Wähle Burger aus und gib deine erste Bestellung auf.</div>
    </div>`;
    return;
  }
  el.innerHTML = `<div class="olist">${orders.map((o, i) => `
    <div class="ocard">
      <div class="oheader">
        <div>
          <div class="oname">${o.person}</div>
          <div class="otime">${o.time}</div>
        </div>
        <div class="oright">
          <span class="opill ${o.done ? 'op-done' : 'op-pending'}">${o.done ? '✓ Fertig' : '⏳ In Zubereitung'}</span>
          <button class="otoggle" onclick="toggleDone(${i})">${o.done ? 'Zurücksetzen' : 'Als fertig markieren'}</button>
        </div>
      </div>
      <div class="oitems">${o.items.map(it => `${it.qty}× ${it.name}`).join('&emsp;·&emsp;')}</div>
      <div class="ototal">${fmt(o.total)}</div>
    </div>`).join('')}</div>`;
}

function toggleDone(i) { orders[i].done = !orders[i].done; renderOrders(); }

function updateBadge() {
  const n = orders.filter(o => !o.done).length;
  /* Desktop */
  const b = document.getElementById('obadge');
  b.textContent = n;
  b.style.display = n > 0 ? 'inline-flex' : 'none';
  /* Mobile */
  const bm = document.getElementById('bn-obadge');
  if (bm) { bm.textContent = n; bm.style.display = n > 0 ? 'inline-flex' : 'none'; }
}

/* ── MODAL (Desktop) ── */
function openModal() {
  if (!cart.length) return;
  const name = document.getElementById('uname').value.trim() || 'Anonym';
  _showModal(name);
}

/* ── MODAL (Mobile) ── */
function openModalMobile() {
  if (!cart.length) return;
  const name = document.getElementById('uname-d').value.trim() || 'Anonym';
  toggleDrawer();
  _showModal(name);
}

function _showModal(name) {
  const total = cart.reduce((s, c) => s + c.price * c.qty, 0);
  const el = document.createElement('div');
  el.className = 'overlay';
  el.innerHTML = `
    <div class="modal">
      <div class="modal-t">Bestellung prüfen</div>
      <div class="modal-for">Für <strong>${name}</strong></div>
      ${cart.map(c => `
        <div class="mitem">
          <span>${c.qty}× ${c.name}</span>
          <span class="mitem-p">${fmt(c.price * c.qty)}</span>
        </div>`).join('')}
      <hr class="mdiv">
      <div class="mtotal">
        <span class="mtotal-l">Gesamt</span>
        <span class="mtotal-p">${fmt(total)}</span>
      </div>
      <div class="mactions">
        <button class="btn-cancel" onclick="this.closest('.overlay').remove()">Abbrechen</button>
        <button class="btn-confirm" onclick="confirmOrder(this,'${name.replace(/'/g,"\\'")}',${total})">Jetzt bestellen 🍔</button>
      </div>
    </div>`;
  document.body.appendChild(el);
}

function confirmOrder(btn, name, total) {
  const now = new Date();
  orders.unshift({
    person: name,
    items:  cart.map(c => ({ name: c.name, qty: c.qty })),
    total,
    done:   false,
    time:   now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr'
  });
  cart = [];
  renderCart();
  updateBadge();
  const ov = btn.closest('.overlay');
  ov.innerHTML = `<div class="modal" style="text-align:center">
    <span class="success-big">✅</span>
    <div class="modal-t" style="margin-bottom:6px">Bestellt!</div>
    <div class="modal-for" style="margin-bottom:22px">Danke, <strong>${name}</strong> — deine Bestellung ist eingegangen.</div>
    <button class="btn-confirm" onclick="this.closest('.overlay').remove();gotoPage('orders')">Zur Übersicht →</button>
  </div>`;
}

/* ── INIT ── */
gotoPage('burger');
</script>
</body>
</html>
